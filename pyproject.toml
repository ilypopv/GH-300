[project]
name = "mock-exam-site"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["flask", "markdown"]

[project.scripts]
mock-exam = "server:main"
mock-exams = "server:main"

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["server"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
extend-select = ["D"]

[tool.ruff.lint.pydocstyle]
convention = "google"
